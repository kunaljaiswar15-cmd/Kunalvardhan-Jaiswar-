<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Scientific calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@500;700&display=swap">
<style>
:root{
  --page:#DCE2EA; --body:#2C3E5C; --body-edge:#1B2840;
  --lcd:#CBD8B6; --lcd-ink:#1E2A1B; --lcd-dim:#5A6A50;
  --num:#EFEADF; --num-ink:#1F2230;
  --fn:#445A80; --fn-ink:#F2F5FA;
  --op:#E3AE42; --op-ink:#2A2008;
  --eq:#2FA39A; --eq-ink:#03211F;
  --clr:#B6465F; --clr-ink:#FFF4F6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0F131A; --body-edge:#0C1424; }
}
:root[data-theme="dark"]{ --page:#0F131A; --body-edge:#0C1424; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--page);
  display:grid;place-items:center;padding:16px;
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
.calc{
  width:min(100%,380px);background:var(--body);border-radius:24px;padding:18px;
  box-shadow:0 0 0 2px var(--body-edge),0 24px 40px -16px rgba(10,18,34,.55);
}
.lcd{
  background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:10px 14px 12px;
  box-shadow:inset 0 3px 8px rgba(20,30,15,.35);margin-bottom:18px;
  font-family:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  display:flex;flex-direction:column;gap:4px;min-height:132px;
}
.status{display:flex;justify-content:space-between;font-size:12px;color:var(--lcd-dim);height:16px}
#s2{visibility:hidden}
#s2.on{visibility:visible}
#expr{
  font-size:20px;line-height:1.3;text-align:right;white-space:nowrap;overflow-x:auto;
  scrollbar-width:none;min-height:28px;
}
#expr::-webkit-scrollbar{display:none}
#res{
  font-size:36px;font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;
  min-height:48px;line-height:48px;margin-top:auto;
}
#res.dim{color:var(--lcd-dim)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pad button{
  font:inherit;font-weight:700;font-size:18px;height:50px;border:0;border-radius:10px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.38);transition:transform .06s,box-shadow .06s,filter .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.38)}
.pad button:hover{filter:brightness(1.07)}
.pad button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.num{background:var(--num);color:var(--num-ink)}
.fn{background:var(--fn);color:var(--fn-ink);font-size:15px!important}
.op{background:var(--op);color:var(--op-ink);font-size:22px!important}
.eq{background:var(--eq);color:var(--eq-ink);font-size:24px!important}
.clr{background:var(--clr);color:var(--clr-ink)}
.fn.on{background:var(--op);color:var(--op-ink)}
@media (prefers-reduced-motion: reduce){.pad button{transition:none}}
@media (max-width:360px){.pad{gap:7px}.pad button{height:46px}}
</style>
</head>
<body>
<main class="calc" aria-label="Scientific calculator">
  <div class="lcd" role="group" aria-label="Display">
    <div class="status"><span id="smode">DEG</span><span id="s2">2nd</span></div>
    <div id="expr" aria-live="off">0</div>
    <div id="res" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad"></div>
</main>
<script>
(function(){
  var expr="", justEval=false, deg=true, second=false, ans=0, err=false;
  var $=function(s){return document.querySelector(s)};
  var exprEl=$("#expr"), resEl=$("#res"), pad=$("#pad");

  var K=function(t,o){o=o||{};o.t=t;return o};
  var N=function(d){return K(d,{c:"num",i:d})};
  var spec=[
    K("2nd",{c:"fn",a:"second",al:"Second function"}),
    K("DEG",{c:"fn",a:"mode",al:"Switch between degrees and radians"}),
    K("π",{c:"fn",i:"π"}), K("e",{c:"fn",i:"e"}),
    K("⌫",{c:"fn",a:"back",al:"Backspace"}),
    K("sin",{c:"fn",i:"sin(",t2:"sin⁻¹",i2:"asin("}),
    K("cos",{c:"fn",i:"cos(",t2:"cos⁻¹",i2:"acos("}),
    K("tan",{c:"fn",i:"tan(",t2:"tan⁻¹",i2:"atan("}),
    K("(",{c:"fn",i:"("}), K(")",{c:"fn",i:")"}),
    K("ln",{c:"fn",i:"ln(",t2:"eˣ",i2:"e^("}),
    K("log",{c:"fn",i:"log(",t2:"10ˣ",i2:"10^("}),
    K("√",{c:"fn",i:"√(",t2:"∛",i2:"cbrt(",al:"Square root"}),
    K("x²",{c:"fn",i:"^2",t2:"x³",i2:"^3",al:"Square"}),
    K("xʸ",{c:"fn",i:"^",al:"Power"}),
    N("7"),N("8"),N("9"),K("÷",{c:"op",i:"÷",al:"Divide"}),K("AC",{c:"clr",a:"clear",al:"All clear"}),
    N("4"),N("5"),N("6"),K("×",{c:"op",i:"×",al:"Multiply"}),K("n!",{c:"fn",i:"!",al:"Factorial"}),
    N("1"),N("2"),N("3"),K("−",{c:"op",i:"−",al:"Subtract"}),K("1/x",{c:"fn",i:"^(−1)",al:"Reciprocal"}),
    N("0"),N("."),K("Ans",{c:"fn",i:"Ans",al:"Previous answer"}),K("+",{c:"op",i:"+",al:"Add"}),K("=",{c:"eq",a:"eq",al:"Equals"})
  ];
  spec.forEach(function(k){
    var b=document.createElement("button");
    b.type="button";b.className=k.c;b.textContent=k.t;
    b.setAttribute("aria-label",k.al||k.t);
    b.addEventListener("click",function(){press(k)});
    k.el=b;pad.appendChild(b);
  });

  function updateKeys(){
    spec.forEach(function(k){
      if(k.t2) k.el.textContent=second?k.t2:k.t;
      if(k.a==="second") k.el.classList.toggle("on",second);
      if(k.a==="mode") k.el.textContent=deg?"DEG":"RAD";
    });
    $("#s2").classList.toggle("on",second);
    $("#smode").textContent=deg?"DEG":"RAD";
    render();
  }

  /* ---------- parser ---------- */
  var NAMES="asin|acos|atan|sin|cos|tan|ln|log|cbrt|Ans|e";
  var RE=new RegExp("(\\d+\\.?\\d*|\\.\\d+|(?:"+NAMES+")|[π√]|[+\\-−×÷*\\/^!%()])","y");
  function trig(f,a,isTan){
    if(isTan&&deg&&Math.abs(((a%180)+180)%180-90)<1e-12) return NaN;
    var r=f(deg?a*Math.PI/180:a);
    return Math.abs(r)<1e-14?0:r;
  }
  function inv(f,a){var r=f(a);return deg?r*180/Math.PI:r}
  var F={
    sin:function(a){return trig(Math.sin,a)},
    cos:function(a){return trig(Math.cos,a)},
    tan:function(a){return trig(Math.tan,a,true)},
    asin:function(a){return inv(Math.asin,a)},
    acos:function(a){return inv(Math.acos,a)},
    atan:function(a){return inv(Math.atan,a)},
    ln:Math.log, log:Math.log10, cbrt:Math.cbrt, "√":Math.sqrt
  };
  function fact(n){
    if(n<0||n>170||Math.floor(n)!==n) throw new Error("domain");
    var r=1;for(var i=2;i<=n;i++) r*=i;return r;
  }
  function evaluate(src){
    var s=src, open=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;
    if(open>0) s+=")".repeat(open);
    var tk=[],m;RE.lastIndex=0;
    while(RE.lastIndex<s.length){m=RE.exec(s);if(!m) throw new Error("syntax");tk.push(m[1])}
    var p=0;
    function peek(){return tk[p]}
    function isStart(t){return t!==undefined&&(/^[\d.]/.test(t)||t==="("||t==="π"||t==="√"||new RegExp("^(?:"+NAMES+")$").test(t))}
    function addsub(){
      var v=term();
      while(peek()==="+"||peek()==="−"||peek()==="-"){var o=tk[p++],r=term();v=o==="+"?v+r:v-r}
      return v;
    }
    function term(){
      var v=unary();
      for(;;){
        var t=peek();
        if(t==="×"||t==="*"){p++;v*=unary()}
        else if(t==="÷"||t==="/"){p++;v/=unary()}
        else if(isStart(t)){v*=power()}
        else break;
      }
      return v;
    }
    function unary(){
      var t=peek();
      if(t==="−"||t==="-"){p++;return -unary()}
      if(t==="+"){p++;return unary()}
      return power();
    }
    function power(){
      var b=post();
      if(peek()==="^"){p++;return Math.pow(b,unary())}
      return b;
    }
    function post(){
      var v=prim();
      while(peek()==="!"||peek()==="%"){v=tk[p++]==="!"?fact(v):v/100}
      return v;
    }
    function prim(){
      var t=tk[p++];
      if(t===undefined) throw new Error("syntax");
      if(/^[\d.]/.test(t)) return parseFloat(t);
      if(t==="π") return Math.PI;
      if(t==="e") return Math.E;
      if(t==="Ans") return ans;
      if(t==="("){var v=addsub();if(tk[p++]!==")") throw new Error("syntax");return v}
      if(F[t]){
        if(tk[p++]!=="(") throw new Error("syntax");
        var a=addsub();if(tk[p++]!==")") throw new Error("syntax");
        return F[t](a);
      }
      throw new Error("syntax");
    }
    var out=addsub();
    if(p<tk.length) throw new Error("syntax");
    if(typeof out!=="number"||!isFinite(out)) throw new Error("domain");
    return out;
  }

  /* ---------- formatting ---------- */
  function fmt(v){
    if(v===0) return "0";
    var a=Math.abs(v),s;
    if(a>=1e12||a<1e-6){
      s=v.toExponential(9).replace(/\.?0+e/,"e").replace("e+","×10^").replace("e-","×10^−");
    } else s=parseFloat(v.toPrecision(12)).toString();
    return s.replace("-","−");
  }
  function fmtExpr(v){
    var s=parseFloat(v.toPrecision(12)).toString().replace(/e\+?(-?\d+)/,"×10^($1)");
    return s.replace(/-/g,"−");
  }

  /* ---------- state changes ---------- */
  function render(){
    exprEl.textContent=expr||"0";
    exprEl.scrollLeft=exprEl.scrollWidth;
    var t="",dim=false;
    if(err){t="Error"}
    else if(justEval){t=fmt(ans)}
    else if(expr){
      try{
        var v=evaluate(expr);
        if(!/^[−]?[\d.]+$/.test(expr)){t=fmt(v);dim=true}
      }catch(e){}
    }
    resEl.textContent=t;
    resEl.classList.toggle("dim",dim);
    resEl.style.fontSize=t.length>16?"22px":t.length>11?"28px":"36px";
  }
  function put(s){
    if(err){expr="";err=false}
    if(justEval){
      expr=/^[+−×÷^!%]/.test(s)?fmtExpr(ans):"";
      justEval=false;
    }
    if(s==="."&&/\d*\.\d*$/.test(expr)) return;
    if(/^[+×÷]$/.test(s)&&/[+×÷]$/.test(expr)) expr=expr.slice(0,-1);
    expr+=s;
    render();
  }
  function back(){
    if(err){expr="";err=false}
    justEval=false;
    expr=expr.replace(/(?:asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|ln\(|log\(|cbrt\(|√\(|10\^\(|e\^\(|Ans|[\s\S])$/,"");
    render();
  }
  function clear(){expr="";justEval=false;err=false;render()}
  function equals(){
    if(!expr||justEval||err) return;
    try{ans=evaluate(expr);justEval=true}
    catch(e){err=true}
    render();
  }
  function press(k){
    if(k.a==="second"){second=!second;updateKeys();return}
    if(k.a==="mode"){deg=!deg;updateKeys();return}
    if(k.a==="back") back();
    else if(k.a==="clear") clear();
    else if(k.a==="eq") equals();
    else put(second&&k.i2?k.i2:k.i);
    if(second&&k.i2){second=false;updateKeys()}
  }

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var k=e.key;
    if(/^[0-9.]$/.test(k)) put(k);
    else if(k==="+") put("+");
    else if(k==="-") put("−");
    else if(k==="*"||k==="x") put("×");
    else if(k==="/") {e.preventDefault();put("÷")}
    else if(k==="(") put("(");
    else if(k===")") put(")");
    else if(k==="^") put("^");
    else if(k==="!") put("!");
    else if(k==="%") put("%");
    else if(k==="p") put("π");
    else if(k==="=") {e.preventDefault();equals()}
    else if(k==="Enter"){ if(e.target.tagName==="BUTTON") return; e.preventDefault();equals() }
    else if(k==="Backspace") back();
    else if(k==="Escape") clear();
  });

  updateKeys();
})();
</script>
</body>
</html>
